title:
  pt: Analista de Dados
  en: Data Analyst
bullets:
  pt:
    - Analisei dados de vendas de mais de 200 lojas com SQL e Python para apoiar decisões de estoque.
    - Construí dashboards de KPIs comerciais usados semanalmente pela diretoria.
    - Desenhei e analisei testes A/B de campanhas de e-mail e promoções.
  en:
    - Analyzed sales data from 200+ stores with SQL and Python to support inventory decisions.
    - Built commercial KPI dashboards used weekly by the leadership team.
    - Designed and analyzed A/B tests for email campaigns and promotions.
