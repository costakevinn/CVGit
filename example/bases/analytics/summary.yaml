pt: >
  Analista de dados que transforma perguntas de negócio em métricas, dashboards e
  recomendações claras. Trabalho com SQL, Python e Power BI, do levantamento dos dados
  à apresentação dos resultados para a gestão.
en: >
  Data analyst who turns business questions into metrics, dashboards and clear
  recommendations. I work with SQL, Python and Power BI, from gathering the data to
  presenting the results to management.
