pt: >
  Engenheiro de dados com foco em pipelines em tempo real: ingestão de eventos,
  processamento em streaming e monitoramento, com Python, SQL e Docker. Experiência em
  levar dados de várias fontes a um data warehouse confiável.
en: >
  Data engineer focused on real-time pipelines: event ingestion, stream processing and
  monitoring, with Python, SQL and Docker. Experienced in bringing data from many sources
  into a reliable data warehouse.
